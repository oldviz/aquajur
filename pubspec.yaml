name: aquarium_journal
description: Aquarium journal
publish_to: 'none'
version: 0.5.19

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: ^2.26.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.0
  path: ^1.8.0
  file_picker: ^13.1.0
  share_plus: ^13.3.1
  http: ^1.2.2
  intl: ^0.20.3
  package_info_plus: ^10.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_launcher_icons: ^0.14.3
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.13
  drift_dev: ^2.26.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#071B2A"
  adaptive_icon_foreground: "assets/app_icon_foreground.png"