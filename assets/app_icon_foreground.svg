<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 432" width="432" height="432">
  <defs>
    <clipPath id="tankClip">
      <rect x="124" y="258" width="264" height="164" rx="26" />
    </clipPath>

    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" />
      <stop offset="1" stop-color="#0891B2" />
    </linearGradient>
  </defs>

  <g transform="translate(216 216) scale(0.68) translate(-254 -241.5)">
    <!-- Белый котик -->
    <path fill="#FFFFFF" d="M143 132 L116 49 L214 98 Z" />
    <path fill="#FFFFFF" d="M369 132 L396 49 L298 98 Z" />

    <ellipse cx="256" cy="214" rx="134" ry="118" fill="#FFFFFF" />

    <!-- Розовые внутренности ушек -->
    <path fill="#FFC7D5" d="M154 126 L136 76 L194 104 Z" />
    <path fill="#FFC7D5" d="M358 126 L376 76 L318 104 Z" />

    <!-- Глаза -->
    <ellipse cx="209" cy="190" rx="15" ry="19" fill="#0F172A" />
    <ellipse cx="303" cy="190" rx="15" ry="19" fill="#0F172A" />

    <circle cx="214" cy="184" r="5" fill="#FFFFFF" opacity="0.9" />
    <circle cx="308" cy="184" r="5" fill="#FFFFFF" opacity="0.9" />

    <!-- Нос / рот -->
    <path
      d="M246 222 Q256 232 266 222"
      stroke="#0F172A"
      stroke-width="7"
      fill="none"
      stroke-linecap="round"
    />
    <path
      d="M256 210 L256 222"
      stroke="#0F172A"
      stroke-width="6"
      stroke-linecap="round"
    />

    <!-- Аквариум -->
    <rect
